# ローカル Docker・ライブ編集用（ルート app.js）
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3050:3050"
    env_file:
      - .env
    environment:
      PORT: "3050"
      PLAYWRIGHT_CHROMIUM_NO_SANDBOX: "1"
    volumes:
      # ホストのソースをそのまま使う（保存で即反映）
      - ./:/app
      # コンテナ内の node_modules をホストで上書きしない
      - app_node_modules:/app/node_modules
    command: ["npx", "nodemon", "--watch", ".", "--ext", "js,ejs,json,css", "app.js"]
    restart: unless-stopped

volumes:
  app_node_modules:
