# 現行ルート app.js 用（ローカル Docker・ライブ編集）
# 旧 server/ 向け構成は使わない
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3050:3050"
    env_file:
      - .env
    environment:
      PORT: "3050"
      PLAYWRIGHT_CHROMIUM_NO_SANDBOX: "1"
    volumes:
      # ホストのソースをそのまま使う（保存で即反映）
      - ./:/app
      # コンテナ内の node_modules をホストで上書きしない
      - app_node_modules:/app/node_modules
    command: ["npx", "nodemon", "--watch", ".", "--ext", "js,ejs,json,css", "app.js"]
    restart: unless-stopped

volumes:
  app_node_modules:
