# 現行ルート app.js 用（MySQL 不要）
# 旧 server/ 向け構成は使わない
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3050:3050"
    env_file:
      - .env
    environment:
      PORT: "3050"
      PLAYWRIGHT_CHROMIUM_NO_SANDBOX: "1"
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports
    restart: unless-stopped
